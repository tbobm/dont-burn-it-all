name: release

on:
  release:
    types: [published]   # fired by release-please when it publishes a version

permissions:
  contents: read
  packages: write

jobs:
  ko-release:
    runs-on: ubuntu-latest
    env:
      KO_DOCKER_REPO: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: ko-build/setup-ko@v0.7
      - name: Log in to ghcr.io
        run: echo "${{ github.token }}" | ko login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and push release image
        run: ko build --bare --tags "${{ github.event.release.tag_name }},latest" .
